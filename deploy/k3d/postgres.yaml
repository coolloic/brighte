# Postgres 17: one primary and one streaming replica, run by the CloudNativePG operator.
# Services it creates: brighte-db-rw (the primary, for writes), brighte-db-ro (replicas only).
apiVersion: v1
kind: Secret
metadata:
  name: brighte-db-app
type: kubernetes.io/basic-auth
stringData:
  username: brighte
  password: brighte-poc
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: brighte-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: brighte
      owner: brighte
      secret:
        name: brighte-db-app
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
  # 2 vCPU each, like a db.m6g.large; requests = limits, so each instance gets exactly that.
  resources:
    requests: { cpu: "2", memory: 1Gi }
    limits: { cpu: "2", memory: 1Gi }
  storage:
    size: 2Gi
