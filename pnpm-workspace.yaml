packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: false
  unrs-resolver: false
  "@apollo/protobufjs": false
  "@parcel/watcher": false
  esbuild: false
  "@google/genai": false
  protobufjs: false
  # Ships its native binaries in the package; the install script only fetches optional GPU builds.
  onnxruntime-node: false
