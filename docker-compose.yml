services:
  postgres:
    # Postgres 17 with the pgvector extension ("My data": embeddings for the chat's recall).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brighte
      POSTGRES_PASSWORD: brighte
      POSTGRES_DB: brighte
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `docker compose up --wait` (pnpm db:up) return once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brighte -d brighte"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
